[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-commerce-handbook"
version = "0.1.0"
description = "Naresh's agentic commerce API handbook and project portfolio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["projects"]
pythonpath = [
  "projects/01-commerce-api",
  "projects/02-mcp-tool-server",
  "projects/03-partner-integration-poc",
  "projects/04-agentic-quality-evals"
]

[tool.ruff]
line-length = 100
target-version = "py311"

